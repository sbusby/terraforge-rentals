# Cloudflare Pages project for terraforgellc.com
name = "terraforge-rentals"
compatibility_date = "2026-10-01"
pages_build_output_dir = "site"

[[d1_databases]]
binding = "DB"
database_name = "terraforge-reservations"
# Replace with the id printed by: npx wrangler d1 create terraforge-reservations
database_id = "b09e798a-b980-4b8b-9179-acb415f04b1b"
migrations_dir = "migrations"

# Plain settings (secrets go in the dashboard or `wrangler pages secret put`):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ADMIN_TOKEN
[vars]
# Tax at checkout. Set ONE of these (see CLOUDFLARE_MIGRATION.md):
#   STRIPE_AUTOMATIC_TAX = "true"        -> Stripe Tax works out the rate from the job-site address
#   STRIPE_TAX_RATE_ID   = "txr_..."     -> one fixed rate you create in Stripe
STRIPE_AUTOMATIC_TAX = "true"
